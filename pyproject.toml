[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisforge"
version = "0.1.9"
description = "Offline, evidence-based source and configuration security analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
aegisforge = "aegisforge.cli:main"

[tool.setuptools.packages.find]
include = ["aegisforge*"]

[tool.setuptools.package-data]
aegisforge = ["web/*.html", "web/*.css", "web/*.js"]
